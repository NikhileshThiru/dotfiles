# macOS-only Ghostty settings, loaded by `config-file = ?macos.conf` in config.
# Not linked on Linux (see install.sh).
#
# Examples (uncomment to use):
#
# Make Option act as Alt, e.g. for the <A-j>/<A-k> line-move maps in nvim:
# macos-option-as-alt = true
#
# Put tabs in the titlebar:
# macos-titlebar-style = tabs
