# Linux-only Ghostty settings, loaded by `config-file = ?linux.conf` in config.
# Not linked on macOS (see install.sh).

# Omarchy's current theme colors; follows `omarchy theme set`.
config-file = ?"~/.local/state/omarchy/current/theme/ghostty.conf"

background-opacity = 0.85

# Omarchy's font. jarvis's btop tile is sized for this (it needs 60x18 cells).
font-family = "JetBrainsMono Nerd Font"
font-size = 9

# Send Alt+Shift+Enter as CSI-u so tmux can tell it apart from Alt+Enter
# (Omarchy's tmux binds M-S-Enter to a horizontal split).
keybind = alt+shift+enter=csi:13;4u
