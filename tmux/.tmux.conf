# --- hard override: no green status bar ---
set -g status-style "bg=black,fg=white"
set -g status-left-style "bg=black,fg=white"
set -g status-right-style "bg=black,fg=white"

# keep the bar on
set -g status on

# Optional: make it a bit slimmer
set -g status-left-length 40
set -g status-right-length 120

# --- Match terminal background (no hard black) ---
set -g status-style "bg=default,fg=white"
set -g status-left-style "bg=default,fg=white"
set -g status-right-style "bg=default,fg=white"

# --- Remove green pane borders ---
set -g pane-border-style "fg=colour238,bg=default"
set -g pane-active-border-style "fg=colour245,bg=default"

# Optional: match messages too
set -g message-style "fg=white,bg=default"
set -g mode-style "fg=black,bg=colour245"


# Match terminal background so tmux "black" matches Neovim/terminal theme
set -g status-style "bg=default,fg=white"

# Pane border colors (kills green lines)
set -g pane-border-style "fg=colour238,bg=default"
set -g pane-active-border-style "fg=colour245,bg=default"

# Optional: message + mode colors
set -g message-style "fg=white,bg=default"
set -g mode-style "fg=black,bg=colour245"

set -g renumber-windows on
set -g aggressive-resize off

# Resize Copilot pane (right)
bind -r H resize-pane -R 2
bind -r L resize-pane -L 2

# Resize bottom shell
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1

set -g mouse on
set -g allow-passthrough on
set -g terminal-overrides ',*:smcup@:rmcup@'
set -g history-limit 200000

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"

# Carbonfox-ish palette
set -g status-style "bg=#161616,fg=#b6b8bb"
set -g pane-border-style "fg=#3a3a3a,bg=default"
set -g pane-active-border-style "fg=#3a3a3a,bg=default"

set -g message-style "bg=#161616,fg=#b6b8bb"
set -g mode-style "bg=#2a2a2a,fg=#eaeaea"

# Copy mode selection styling
set -g @copy_mode_bg "#2a2a2a"
set -g @copy_mode_fg "#eaeaea"
setw -g mode-keys vi
set -g window-style "bg=default"
set -g window-active-style "bg=default"

# Status layout basics
set -g status-left-length 60
set -g status-right-length 120
set -g status-left "#[fg=#a6a6a6,bg=#161616] #{session_name} #[default]"
set -g status-right "#[fg=#a6a6a6,bg=#161616] %Y-%m-%d %H:%M #[default]"

# Make inactive window titles subtle
setw -g window-status-style "fg=#7a7a7a,bg=#161616"
setw -g window-status-current-style "fg=#eaeaea,bg=#161616"

# --- macOS only ---
# Everything inside this block is skipped on Linux.
if-shell 'uname | grep -q Darwin' {
  # Example: also send vi-mode yanks to pbcopy (OSC 52 already reaches the
  # system clipboard in Ghostty, so this is optional):
  # bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
}
