# Yazi colors: cyan #00c8ff accent, #7aa2f7 secondary, on the dark terminal
# background. Only colors are set here; everything else comes from Yazi's
# built-in dark preset.
#:schema https://yazi-rs.github.io/schemas/theme.json

[mgr]
cwd = { fg = "#00c8ff", bold = true }

find_keyword  = { fg = "#00c8ff", bold = true, underline = true }
find_position = { fg = "#7aa2f7", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#00c8ff", bg = "#00c8ff" }
marker_cut      = { fg = "#f7768e", bg = "#f7768e" }
marker_marked   = { fg = "#7aa2f7", bg = "#7aa2f7" }
marker_selected = { fg = "#7aa2f7", bg = "#7aa2f7" }

count_copied   = { fg = "#06070a", bg = "#00c8ff" }
count_cut      = { fg = "#06070a", bg = "#f7768e" }
count_selected = { fg = "#06070a", bg = "#7aa2f7" }

border_style = { fg = "#2a3142" }

[tabs]
active   = { fg = "#06070a", bg = "#00c8ff", bold = true }
inactive = { fg = "#7aa2f7", bg = "#161b26" }

[mode]
normal_main = { fg = "#06070a", bg = "#00c8ff", bold = true }
normal_alt  = { fg = "#00c8ff", bg = "#161b26" }
select_main = { fg = "#06070a", bg = "#7aa2f7", bold = true }
select_alt  = { fg = "#7aa2f7", bg = "#161b26" }
unset_main  = { fg = "#06070a", bg = "#f7768e", bold = true }
unset_alt   = { fg = "#f7768e", bg = "#161b26" }

[indicator]
parent  = { fg = "#06070a", bg = "#7aa2f7" }
current = { fg = "#06070a", bg = "#00c8ff", bold = true }
preview = { underline = true }

[status]
perm_sep   = { fg = "#3b4252" }
perm_type  = { fg = "#7aa2f7" }
perm_read  = { fg = "#00c8ff" }
perm_write = { fg = "#f7768e" }
perm_exec  = { fg = "#5dd9d6" }

progress_label  = { bold = true }
progress_normal = { fg = "#00c8ff", bg = "#161b26" }
progress_error  = { fg = "#f7768e", bg = "#161b26" }

[which]
border          = { fg = "#00c8ff" }
cand            = { fg = "#00c8ff" }
rest            = { fg = "#565f89" }
desc            = { fg = "#7aa2f7" }
separator_style = { fg = "#3b4252" }

[confirm]
border  = { fg = "#00c8ff" }
title   = { fg = "#00c8ff", bold = true }
btn_yes = { fg = "#06070a", bg = "#00c8ff" }

[spot]
border   = { fg = "#00c8ff" }
title    = { fg = "#00c8ff" }
tbl_col  = { fg = "#7aa2f7" }
tbl_cell = { fg = "#00c8ff", reversed = true }

[notify]
title_info  = { fg = "#00c8ff" }
title_warn  = { fg = "#e0af68" }
title_error = { fg = "#f7768e" }

[pick]
border = { fg = "#00c8ff" }
active = { fg = "#7aa2f7", bold = true }

[input]
border = { fg = "#00c8ff" }
title  = { fg = "#7aa2f7" }

[cmp]
border = { fg = "#00c8ff" }

[tasks]
border  = { fg = "#00c8ff" }
hovered = { fg = "#7aa2f7", bold = true }

[help]
border  = { fg = "#00c8ff" }
chord   = { fg = "#00c8ff" }
hovered = { reversed = true, bold = true }

[filetype]
rules = [
	# Images, media
	{ mime = "**/image/*", fg = "#7aa2f7" },
	{ mime = "**/{audio,video}/*", fg = "#bb9af7" },
	# Archives
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f7768e" },
	# Documents
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#5dd9d6" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "gray" },
	# Special files
	{ url = "*", is = "orphan", bg = "#f7768e" },
	{ url = "*", is = "exec", fg = "#9ece6a" },
	# Dummy files
	{ url = "*", is = "dummy", bg = "#f7768e" },
	{ url = "*/", is = "dummy", bg = "#f7768e" },
	# Directories
	{ url = "*/", fg = "#00c8ff", bold = true },
]
